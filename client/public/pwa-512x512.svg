<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE072" />
      <stop offset="100%" stop-color="#F5B82E" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#7BB638" />
      <stop offset="100%" stop-color="#A8D26B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#5B6CFF" />
  <!-- Coin base / Diya base -->
  <ellipse cx="50" cy="72" rx="30" ry="12" fill="url(#coinGrad)" stroke="#1F2540" stroke-width="2.5" />
  <ellipse cx="50" cy="69" rx="26" ry="8" fill="#FFF1B8" />
  <path d="M 20 72 Q 50 86 80 72 L 78 76 Q 50 90 22 76 Z" fill="#DDA01B" />
  <!-- Center Rupee symbol on coin -->
  <text x="50" y="73" font-family="Baloo 2, sans-serif" font-weight="bold" font-size="9" fill="#915B06" text-anchor="middle">₹</text>
  <!-- Sprout stem -->
  <path d="M 50 67 Q 48 45 50 34" stroke="#5E9623" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <!-- Left Leaf -->
  <path d="M 49 48 C 30 46 22 34 32 25 C 44 24 48 38 49 46 Z" fill="url(#leafGrad)" stroke="#1F2540" stroke-width="2" />
  <!-- Right Leaf -->
  <path d="M 51 43 C 70 41 78 29 68 20 C 56 19 52 33 51 41 Z" fill="url(#leafGrad)" stroke="#1F2540" stroke-width="2" />
  <!-- Sprout Face (Friendly Kamu Eyes & Blush) -->
  <ellipse cx="44" cy="54" rx="2.5" ry="3.5" fill="#1F2540" />
  <ellipse cx="56" cy="54" rx="2.5" ry="3.5" fill="#1F2540" />
  <circle cx="45" cy="53" r="1" fill="#FFFFFF" />
  <circle cx="57" cy="53" r="1" fill="#FFFFFF" />
  <!-- Smile -->
  <path d="M 47 58 Q 50 61 53 58" stroke="#1F2540" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <!-- Cheeks -->
  <ellipse cx="40" cy="57" rx="2" ry="1" fill="#E8A6D8" opacity="0.8" />
  <ellipse cx="60" cy="57" rx="2" ry="1" fill="#E8A6D8" opacity="0.8" />
</svg>
